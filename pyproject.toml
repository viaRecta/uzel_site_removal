[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footprint-scanner"
version = "0.1.0"
description = "Discover and document where a consenting client appears online, and record findings in the Footprint Removal Tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tldextract>=5.1",
    "playwright>=1.44",
    "reportlab>=4.0",
    "pillow>=10.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
footprint-scanner = "footprint_scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
footprint_scanner = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
